<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors | Classic Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>✊ Rock Paper Scissors ✋</h1>
        
        <div class="choices">
            <div class="choice" id="rock">
                <div class="emoji">✊</div>
                <span>Rock</span>
            </div>
            <div class="choice" id="paper">
                <div class="emoji">✋</div>
                <span>Paper</span>
            </div>
            <div class="choice" id="scissors">
                <div class="emoji">✌️</div>
                <span>Scissors</span>
            </div>
        </div>

        <div class="score-board">
            <div class="score-card">
                <div class="score-value" id="user-score">0</div>
                <div class="score-label">YOU</div>
            </div>
            <div class="vs">VS</div>
            <div class="score-card">
                <div class="score-value" id="comp-score">0</div>
                <div class="score-label">COMPUTER</div>
            </div>
        </div>

        <div class="move-display">
            <div class="your-move">
                <p>Your Move</p>
                <div class="move-icon" id="your-move-icon">❓</div>
            </div>
            <div class="comp-move">
                <p>Computer's Move</p>
                <div class="move-icon" id="comp-move-icon">❓</div>
            </div>
        </div>

        <div class="msg-container">
            <p id="msg">Click on Rock, Paper or Scissors to start!</p>
        </div>

        <button class="reset-btn" id="reset-btn">🔄 Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
